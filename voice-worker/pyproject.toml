[project]
name = "vela-voice-worker"
version = "0.1.0"
description = "LiveKit Agents worker: STT -> stock LLM -> TTS voice round-trip for Vela, with semantic turn detection (V2) and no preemptive generation (V3)."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=0.11.0",
    "livekit-plugins-turn-detector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_worker*"]
