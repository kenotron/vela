[project]
name = "vela-ledger-service"
version = "0.1.0"
description = "Standalone, durable server-side ledger service implementing the C3 REST API and /ledger/events SSE stream (design doc §4.2). No fork of amplifier-agent required."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger_service*"]
