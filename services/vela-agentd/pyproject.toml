[project]
name = "vela-agentd"
version = "0.1.0"
description = "Vela fork of amplifier-agent's HTTP face: event tee (F1), real approval gate (F2), C2 event/control route (F3), C3 ledger wiring (F4)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "amplifier-foundation>=1.0.0",
    "pyyaml>=6.0",
    "mcp",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.scripts]
vela-agentd = "vela_agentd_cli.__main__:main"
vela-agentd-post-install = "vela_agentd_lib.post_install:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vela_agentd_cli", "src/vela_agentd_lib", "src/vela_agentd_http"]

[tool.hatch.build.targets.wheel.force-include]
"src/vela_agentd_lib/bundle/bundle.md" = "vela_agentd_lib/bundle/bundle.md"
"src/vela_agentd_lib/bundle/context/system.md" = "vela_agentd_lib/bundle/context/system.md"
"src/vela_agentd_lib/bundle/agents/explorer.md" = "vela_agentd_lib/bundle/agents/explorer.md"
"src/vela_agentd_lib/bundle/agents/architect.md" = "vela_agentd_lib/bundle/agents/architect.md"
"src/vela_agentd_lib/bundle/agents/builder.md" = "vela_agentd_lib/bundle/agents/builder.md"
"src/vela_agentd_lib/bundle/agents/debugger.md" = "vela_agentd_lib/bundle/agents/debugger.md"
"src/vela_agentd_lib/bundle/agents/git-ops.md" = "vela_agentd_lib/bundle/agents/git-ops.md"
"src/vela_agentd_lib/bundle/agents/researcher.md" = "vela_agentd_lib/bundle/agents/researcher.md"
"src/vela_agentd_lib/protocol/spec.md" = "vela_agentd_lib/protocol/spec.md"

[tool.uv.sources]
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
