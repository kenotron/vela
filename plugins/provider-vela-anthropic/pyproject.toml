[project]
    name = "amplifier-module-provider-vela-anthropic"
    version = "0.1.0"
    description = "Vela streaming Anthropic provider — adds stream() for real per-token output"
    requires-python = ">=3.11"
    license = { text = "MIT" }
    dependencies = []  # amplifier-core and amplifier-module-provider-anthropic are peer deps

    [project.entry-points."amplifier.modules"]
    provider-vela-anthropic = "amplifier_module_provider_vela_anthropic:mount"
    provider-anthropic       = "amplifier_module_provider_vela_anthropic:mount"

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["amplifier_module_provider_vela_anthropic"]
    