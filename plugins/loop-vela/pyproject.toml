[project]
name = "amplifier-module-loop-vela"
version = "0.1.0"
description = "Vela orchestrator — loop-streaming + per-token delta events + steer-inject"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # amplifier-core is a peer dependency

[project.entry-points."amplifier.modules"]
loop-vela = "amplifier_module_loop_vela:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_loop_vela"]
