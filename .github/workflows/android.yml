name: android

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  instrumented-tests:
    runs-on: ubuntu-latest
    # Requires KVM-backed runners (ubuntu-latest GitHub-hosted runners provide
    # nested virtualization for the emulator action). Gated as a separate job
    # so a lack of hardware acceleration in other environments never blocks
    # the build/lint job above.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          # Runtime permissions (READ_CALENDAR/WRITE_CALENDAR/POST_NOTIFICATIONS)
          # are not auto-granted to the test APK on API 23+; grant them to
          # every debug + androidTest package before running, per design doc
          # §13.3. Without this, CalendarToolsInstrumentedTest fails with
          # SecurityException: Permission Denial opening CalendarProvider2.
          script: |
            for pkg in com.vela.app com.vela.app.test com.vela.hosttools.test; do
              adb shell pm grant "$pkg" android.permission.READ_CALENDAR || true
              adb shell pm grant "$pkg" android.permission.WRITE_CALENDAR || true
              adb shell pm grant "$pkg" android.permission.POST_NOTIFICATIONS || true
            done
            ./gradlew connectedDebugAndroidTest --stacktrace
