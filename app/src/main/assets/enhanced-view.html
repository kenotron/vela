<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script type="importmap">{"imports":{
    "lit":          "/lib/lit-core.min.js",
    "@vela/runtime":"/lib/vela-runtime.js",
    "@vela/remark": "/lib/remark.min.js",
    "@vela/":       "/blocks/"
  }}</script>
  <script type="module">
    import '@vela/vela-content-renderer.js';
    import { vela } from '@vela/runtime';
    window.onVelaReady = async () => {
      const ctx = vela.app.context;
      const dark = ctx.theme?.isDark;
      if (dark) {
        document.documentElement.style.setProperty('--bg',       '#0f0f13');
        document.documentElement.style.setProperty('--text',     '#e5e7eb');
        document.documentElement.style.setProperty('--muted',    '#6b7280');
        document.documentElement.style.setProperty('--border',   '#374151');
        document.documentElement.style.setProperty('--surface2', '#1f2028');
      }
      document.documentElement.style.setProperty('--primary', ctx.theme?.primaryColor || '#7c6ff7');
      await customElements.whenDefined('vela-content-renderer');
      const cr = document.querySelector('vela-content-renderer');
      cr?.load();
      // Expose a reload hook for in-place navigation (itemPath changes without page reload)
      window.__velaReload = () => cr?.reload();
    };
  </script>
  <style>
    :root{--primary:#7c6ff7;--surface2:#f3f4f6;--border:#e5e7eb;--muted:#9ca3af;--text:#111;--bg:#fff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
  </style>
</head>
<body>
  <vela-content-renderer></vela-content-renderer>
</body>
</html>
